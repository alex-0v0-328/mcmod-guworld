plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // The datagen cache sits at the root of src/generated/resources, so the pattern is relative to it.
    exclude('.cache/**')
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Every test lives under src/test/game, local-only and gitignored as in Guzhenren, and none of them ships in the
// jar: the L3 'gametest' source set holds the @GameTest classes plus their scene templates, run by
// runGameTestServer on a real dedicated server. The source set joins the mod below, so dev runs still find the tests
// (and the /test command), while the jar task packs only 'main'. It loads Guzhenren like every other run here (see
// dependencies).
sourceSets {
    gametest {
        java.srcDirs = ['src/test/game/java']
        resources.srcDirs = ['src/test/game/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Inside the run closures a bare `project` resolves to Gradle's deprecated Dependencies.getProject() and a bare
// `mod_id` to a run of that name, so they read the id from here.
def modId = providers.gradleProperty('mod_id').get()

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        // Its own game directory keeps the GameTest world apart from the run/ dev world.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // Under build/: every IDE sync creates this directory, and Guzhenren's local_checks.py passes its own.
            gameDirectory = file(providers.gradleProperty('gameTestDir').getOrElse('build/run-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        data {
            data()
            // Under build/ for the same reason as the GameTest directory.
            gameDirectory = file(providers.gradleProperty('dataGameDir').getOrElse('build/run-data'))
            programArguments.addAll '--mod', modId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // Biomes and features ported from Terralith are datagen input, read through this property (biome.Ports).
            systemProperty 'guworld.ports', file('src/ports').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            // Guzhenren's IDEA window links this project too, and its runs use the plain names, so
            // ours carry the project name and a folder instead of overwriting Client, Data, Server.
            ideName = "Gu World ${ideName.get()}"
            ideFolderName = 'Gu World'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // src/test is local-only (gitignored), so a CI checkout has no GameTests to join.
            if (file('src/test/game/java').isDirectory()) {
                sourceSet(sourceSets.gametest)
            }
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Guzhenren, the sibling project at ../mcmod-guzhenren (or -PguzhenrenDir), is a required mod, so every run
// here, runData and the GameTests included, loads its built jar plus what it needs: Epic Fight and GeckoLib from its
// run/mods. This mod compiles against none of them. A jar that is not there adds nothing, and the run
// then stops on the missing dependency; build Guzhenren first.
def guzhenrenDir = file(providers.gradleProperty('guzhenrenDir').getOrElse('../mcmod-guzhenren'))

dependencies {
    localRuntime fileTree(dir: new File(guzhenrenDir, 'build/libs'), include: 'guzhenren-*.jar', exclude: '*-sources.jar')
    localRuntime fileTree(dir: new File(guzhenrenDir, 'run/mods'), include: ['epic-fight-*.jar', 'geckolib-*.jar'])
}

// GameTests run with the same Guzhenren set as the runs and compile against everything the mod compiles against.
neoForge.addModdingDependenciesTo sourceSets.gametest
configurations {
    gametestCompileOnly.extendsFrom compileOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom localRuntime, runtimeOnly
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            guzhenren_version_range: guzhenren_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
