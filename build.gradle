plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // The datagen cache sits at the root of src/generated/resources, so the pattern is relative to it.
    exclude('.cache/**')
}

repositories {
    // Curios, which Guzhenren needs at run time (see dependencies).
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Every test lives under src/test, local-only and gitignored as in Guzhenren, one folder per layer,
// and none of them ships in the jar:
//   modded  L2 'test': modded JUnit with registries loaded but no world.
//   game    L3 'gametest': @GameTest classes plus their scene templates, run by runGameTestServer
//           on a real dedicated server. The source set joins the mod below, so dev runs still find
//           the tests (and the /test command), while the jar task packs only 'main'.
// Both load Guzhenren like every other run here (see dependencies).
sourceSets {
    test {
        java.srcDirs = ['src/test/modded/java']
        resources.srcDirs = ['src/test/modded/resources']
    }
    gametest {
        java.srcDirs = ['src/test/game/java']
        resources.srcDirs = ['src/test/game/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Its own game directory keeps the GameTest world apart from the run/ dev world.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            // Guzhenren's IDEA window links this project too, and its runs use the plain names, so
            // ours carry the project name and a folder instead of overwriting Client, Data, Server.
            ideName = "Gu World ${ideName.get()}"
            ideFolderName = 'Gu World'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // src/test is local-only (gitignored), so a CI checkout has no GameTests to join.
            if (file('src/test/game/java').isDirectory()) {
                sourceSet(sourceSets.gametest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Guzhenren, the sibling project at ../guzhenren (or -PguzhenrenDir), is a required mod, so every run
// here, runData and both test layers included, loads its built jar plus what it needs: Epic Fight and GeckoLib from its
// run/mods, and Curios, whose classes its datagen touches. This mod compiles against none of them. A
// jar that is not there adds nothing, and the run then stops on the missing dependency; build
// Guzhenren first.
def guzhenrenDir = file(providers.gradleProperty('guzhenrenDir').getOrElse('../guzhenren'))

dependencies {
    localRuntime fileTree(dir: new File(guzhenrenDir, 'build/libs'), include: 'guzhenren-*.jar', exclude: '*-sources.jar')
    localRuntime fileTree(dir: new File(guzhenrenDir, 'run/mods'), include: ['epic-fight-*.jar', 'geckolib-*.jar'])
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Both test layers run with the same Guzhenren set as the runs; GameTests also compile against
// everything the mod compiles against.
neoForge.addModdingDependenciesTo sourceSets.gametest
configurations {
    testRuntimeOnly.extendsFrom localRuntime
    gametestCompileOnly.extendsFrom compileOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom localRuntime, runtimeOnly
}

tasks.named('test', Test) {
    workingDir project.file('build/minecraft-junit')
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            guzhenren_version_range: guzhenren_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
