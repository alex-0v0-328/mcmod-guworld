name: Build

# The Forge 1.20.1 branch. main (NeoForge 1.21.1) runs its own workflow; the filters keep a workflow that a
# sync merge carries across from running on the wrong line.
on:
  push:
    branches: [forge-1.20.1]
  pull_request:
    branches: [forge-1.20.1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: guworld
          fetch-depth: 0
          fetch-tags: true

      # Every run here, runData included, loads Guzhenren's jar from the same branch, which is public.
      - name: Checkout Guzhenren
        uses: actions/checkout@v4
        with:
          repository: alex-0v0-328/mcmod-guzhenren
          ref: forge-1.20.1
          path: guzhenren

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Guzhenren compiles against these from its gitignored pack/mods, and runs here load them from there.
      - name: Download Epic Fight
        run: |
          mkdir -p guzhenren/pack/mods
          epic_fight_file=epic-fight-20.14.17-mc1.20.1-forge.jar
          epic_fight_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/KEBfkBat | jq -er --arg file "$epic_fight_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$epic_fight_url" -o "guzhenren/pack/mods/$epic_fight_file"

      - name: Download GeckoLib
        run: |
          mkdir -p guzhenren/pack/mods
          geckolib_file=geckolib-forge-1.20.1-4.8.4.jar
          geckolib_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/aC5KMoNg | jq -er --arg file "$geckolib_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$geckolib_url" -o "guzhenren/pack/mods/$geckolib_file"

      - name: Build Guzhenren
        working-directory: guzhenren
        run: ./gradlew assemble

      # The test suites are local-only (src/test is gitignored) and run through the maintainer's ship tool;
      # this branch's GameTests run when it syncs from main.
      - name: Build with Gradle
        working-directory: guworld
        run: ./gradlew build -PguzhenrenDir="$GITHUB_WORKSPACE/guzhenren"

      # src/generated/resources is a committed source set, and 'build' happily packs a stale one.
      # git diff alone would miss a provider change that ADDS a file, so this asks git status.
      - name: Generated resources are up to date
        working-directory: guworld
        run: |
          ./gradlew runData -PguzhenrenDir="$GITHUB_WORKSPACE/guzhenren"
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is stale. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            git --no-pager diff -- src/generated
            exit 1
          fi
