name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: guworld
          fetch-depth: 0
          fetch-tags: true

      # runData loads Guzhenren's jar from the same branch, which is public.
      - name: Checkout Guzhenren
        uses: actions/checkout@v4
        with:
          repository: alex-0v0-328/mcmod-guzhenren
          ref: main
          path: guzhenren

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Guzhenren compiles against these from its gitignored run/mods, and runs here load them from there.
      - name: Download Epic Fight
        run: |
          mkdir -p guzhenren/run/mods
          epic_fight_file=epic-fight-21.17.3.1-mc1.21.1-neoforge.jar
          epic_fight_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/8HHhJt6i | jq -er --arg file "$epic_fight_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$epic_fight_url" -o "guzhenren/run/mods/$epic_fight_file"

      - name: Download GeckoLib
        run: |
          mkdir -p guzhenren/run/mods
          geckolib_file=geckolib-neoforge-1.21.1-4.9.3.jar
          geckolib_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/Grwn5rUB | jq -er --arg file "$geckolib_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$geckolib_url" -o "guzhenren/run/mods/$geckolib_file"

      - name: Build Guzhenren
        working-directory: guzhenren
        run: ./gradlew assemble

      # The test suites are local-only (src/test is gitignored) and run before every push through the
      # maintainer's ship tool, so CI compiles, packages and checks generated data.
      - name: Build with Gradle
        working-directory: guworld
        run: ./gradlew build -PguzhenrenDir="$GITHUB_WORKSPACE/guzhenren"

      # src/generated/resources is a committed source set, and 'build' happily packs a stale one.
      # git diff alone would miss a provider change that ADDS a file, so this asks git status.
      - name: Generated resources are up to date
        working-directory: guworld
        run: |
          ./gradlew runData -PguzhenrenDir="$GITHUB_WORKSPACE/guzhenren"
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is stale. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            git --no-pager diff -- src/generated
            exit 1
          fi
