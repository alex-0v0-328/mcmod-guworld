modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
The dimensions, terrain and biomes of Guzhenren. Requires Guzhenren.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Guzhenren owns the player data, the anchored-dimension travel and the guards; this mod only
# supplies the worlds they act on. It also rejects a Guzhenren too old for this version.
[[dependencies.${mod_id}]]
    modId="guzhenren"
    mandatory=true
    versionRange="${guzhenren_version_range}"
    ordering="AFTER"
    side="BOTH"
