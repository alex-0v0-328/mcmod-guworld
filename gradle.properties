org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# The dimension ids follow the mod id (guworld:treasure_yellow_heaven).
mod_id=guworld
mod_name=Gu World
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=net.alex.guzhenrenworld

## Guzhenren, the required companion mod (sibling project ../guzhenren)
# The oldest Guzhenren this mod runs with; written into neoforge.mods.toml.
guzhenren_version_range=[1.0.0,)
# Curios is only on the run classpath, because Guzhenren's datagen classes touch it; same version as Guzhenren's.
curios_version=9.5.1+1.21.1
